# Require email confirmation on signup (prevents anonymous/unconfirmed
# accounts from being created). This must be set in the linked project's
# Auth settings (dashboard > Authentication > Providers > Email, or
# `supabase link` + `supabase config push`) to take effect on the live
# database.

# NOTE: Email confirmation is DISABLED for this test project so signups do
# not depend on the hosted email provider (whose send-rate limits can block
# signup entirely with "email rate limit exceeded"). New accounts are created
# and signed in immediately; no confirmation email is sent.

[auth.email]
enable_confirmations = false

